# Service: единый адрес для всех подов iris-api и распределение запросов между ними.
# Тип NodePort открывает сервис снаружи кластера на порту 30080.
apiVersion: v1
kind: Service
metadata:
  name: iris-api
  labels:
    app: iris-api
spec:
  type: NodePort
  selector:
    app: iris-api                 # отправлять запросы подам с этой меткой
  ports:
    - port: 80                    # порт сервиса внутри кластера
      targetPort: 8000            # порт приложения в контейнере
      nodePort: 30080             # порт снаружи: http://localhost:30080